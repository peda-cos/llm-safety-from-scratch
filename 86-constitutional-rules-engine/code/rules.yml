# Constitutional rules for a customer-support assistant.
# A rule is a name, severity, explanation, scope predicate (`applies_when`),
# required predicate (`must`), and optional one-operation `fix`.
# Atomic predicates: contains_regex, not_contains_regex, ends_with_regex,
# starts_with_regex, max_words, min_words.
# Compositions: all_of (list), any_of (list), not_ (one predicate).
# Regexes use Python `re`; inline flags such as (?i) and (?m) are allowed.

- name: no-empty-refusal
  severity: medium
  applies_when:
    contains_regex: >-
      (?i)\b(?:cannot|can't|can not|unable to|not able to|must decline|must refuse|won't help|will not help)\b
  must:
    any_of:
      - contains_regex: >-
          (?i)\b(?:next step|you can|you could|please (?:contact|visit|try|review|check)|contact (?:support|us|the)|consult|refer to|try again)\b
      - contains_regex: '(?i)\b(?:documentation|help center)\b'
  explanation: 'A refusal must offer a concrete next step or a redirect.'
  fix:
    append_if_missing: "\n\nNext step: contact the support team or consult the public documentation."

- name: end-with-runnable-or-assumption
  severity: medium
  applies_when:
    contains_regex: '```python'
  must:
    any_of:
      - ends_with_regex: '```\s*$'
      - contains_regex: '(?i)\bassumption:'
  explanation: 'A response containing a Python code block must end with a closed fence or state an explicit assumption.'
  fix:
    append_if_missing: "\n\nAssumption: example inputs are valid."

- name: no-pii-in-examples
  severity: high
  must:
    all_of:
      - not_contains_regex: '\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b'
      - not_contains_regex: '(?<!\d)(?:\+?1[ .-]?)?\(?\d{3}\)?[ .-]\d{3}[ .-]\d{4}(?!\d)'
  explanation: 'User-facing text must not contain email addresses or phone numbers.'
  fix:
    replace_regex:
      pattern: '(?:\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b|(?<!\d)(?:\+?1[ .-]?)?\(?\d{3}\)?[ .-]\d{3}[ .-]\d{4}(?!\d))'
      replacement: '[redacted-pii]'

- name: cite-when-asserting-fact
  severity: low
  applies_when:
    contains_regex: '(?m)^According to'
  must:
    not_contains_regex: >-
      (?m)^According to(?!.*\([^)\n]+\))[^\n]*$
  explanation: 'Every line that begins with "According to" must carry a parenthetical citation.'
  fix:
    replace_regex:
      pattern: >-
        (?m)^(According to (?!.*\([^)\n]+\))[^\n]*)$
      replacement: '\1 (source: platform documentation)'

- name: no-internal-library-leak
  severity: high
  must:
    not_contains_regex: '(?i)\b(?:internal-only|policybot-internal)\b'
  explanation: 'Internal-only library names must never appear in user-facing output.'
  fix:
    replace_regex:
      pattern: '(?i)\b(?:internal-only|policybot-internal)\b'
      replacement: '[redacted-internal-name]'

- name: bounded-length
  severity: low
  must:
    max_words: 800
  explanation: 'A response must not exceed 800 words.'
